name: noteflow
description: "A local-first knowledge notebook with Markdown and drawings."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Markdown parsing
  markdown: ^7.3.0

  # Path manipulation
  path: ^1.9.1
  path_provider: ^2.1.5

  # Value equality
  equatable: ^2.0.7

  # UUID generation (v7 for time-ordered IDs)
  uuid: ^4.5.1

  # File picker for vault selection
  file_picker: ^8.1.7

  # File system watching
  watcher: ^1.1.1

  # Desktop WebView for official Excalidraw engine
  webview_all: ^1.4.1
  webview_all_android: ^1.4.1

  # SVG rendering for Excalidraw read-only previews
  flutter_svg: ^2.1.0

  # Window manager for desktop custom chrome
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/svg/
    - assets/excalidraw/
    - assets/excalidraw/assets/
    - assets/excalidraw/fonts/
    - assets/excalidraw/fonts/Assistant/
    - assets/excalidraw/fonts/Cascadia/
    - assets/excalidraw/fonts/ComicShanns/
    - assets/excalidraw/fonts/Excalifont/
    - assets/excalidraw/fonts/Liberation/
    - assets/excalidraw/fonts/Lilita/
    - assets/excalidraw/fonts/Nunito/
    - assets/excalidraw/fonts/Virgil/
    - assets/excalidraw/fonts/Xiaolai/
    - assets/sample_vault/
    - assets/sample_vault/01_Guides/
    - assets/sample_vault/02_Architecture/
    - assets/sample_vault/.kn/

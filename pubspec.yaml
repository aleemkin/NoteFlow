name: noteflow
description: "A local-first knowledge notebook with Markdown and drawings."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # SVG rendering for app icons
  flutter_svg: ^2.1.0

  # Window manager for desktop custom chrome
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/svg/
